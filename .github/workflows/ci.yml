name: Pipeline with Build and Jest Test in 2 Jobs

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      # Quellcode + node_modules in ein tar packen. Grund: upload-artifact bewahrt
      # weder Symlinks noch Ausfuehrungsrechte (node_modules/.bin), ein tar schon.
      - name: Pack workspace
        run: tar -cf frontend.tar frontend

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-workspace
          path: frontend.tar
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Variante A: alle Tests in einem Job (Referenz fuer den Vergleich)
  # ---------------------------------------------------------------------------
  tests-baseline:
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-workspace
      - name: Unpack workspace
        run: tar -xf frontend.tar
      - name: Run tests
        working-directory: frontend
        run: npm test

  # ---------------------------------------------------------------------------
  # Variante B: Sharding - die Testdateien werden auf 2 parallele Jobs verteilt.
  # Jest 27 (Create React App) kennt --shard noch nicht (erst ab Jest 28), darum
  # wird die Aufteilung von Hand gemacht: Dateien sortieren, jede n-te nehmen.
  # ---------------------------------------------------------------------------
  tests-sharded:
    runs-on: ubuntu-22.04
    needs: build
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      SHARDS: 2
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-workspace
      - name: Unpack workspace
        run: tar -xf frontend.tar
      - name: Run tests (shard ${{ matrix.shard }}/2)
        working-directory: frontend
        run: |
          FILES=$(find src -name '*.test.tsx' | sort | awk -v n="$SHARDS" -v s="${{ matrix.shard }}" 'NR % n == s % n')
          echo "Shard ${{ matrix.shard }}/$SHARDS testet:"
          echo "$FILES"
          npm test -- $FILES

  # ---------------------------------------------------------------------------
  # Variante C: mehr CPU-Kerne - Jest nutzt standardmaessig Kerne-1 Worker,
  # hier werden alle 4 Kerne des Runners fuer Tests freigegeben.
  # ---------------------------------------------------------------------------
  tests-more-cores:
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-workspace
      - name: Unpack workspace
        run: tar -xf frontend.tar
      - name: Run tests (maxWorkers=4)
        working-directory: frontend
        run: npm test -- --maxWorkers=4
