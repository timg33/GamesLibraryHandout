name: Pipeline with Jest Test

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    # Das Frontend liegt im Unterordner frontend/ (Monorepo mit Backend daneben)
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test
