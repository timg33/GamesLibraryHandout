name: Pipeline with Build and Jest Test in 2 Jobs

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      # Quellcode + node_modules in ein tar packen. Grund: upload-artifact bewahrt
      # weder Symlinks noch Ausfuehrungsrechte (node_modules/.bin), ein tar schon.
      - name: Pack workspace
        run: tar -cf frontend.tar frontend

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-workspace
          path: frontend.tar
          retention-days: 1

  tests:
    runs-on: ubuntu-22.04
    needs: build   # Test-Job wartet, bis der Build-Job erfolgreich ist
    steps:
      # Kein Checkout: alles Noetige kommt als Artefakt aus dem Build-Job
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-workspace

      - name: Unpack workspace
        run: tar -xf frontend.tar

      - name: Run tests
        working-directory: frontend
        run: npm test
