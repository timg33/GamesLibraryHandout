name: Pipeline with Build and Jest Test in 2 Jobs

on:
  push:
    branches:
      - main

# Das Frontend liegt im Unterordner frontend/ (Monorepo mit Backend daneben)
defaults:
  run:
    working-directory: frontend

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

  tests:
    runs-on: ubuntu-22.04
    needs: build   # Test-Job wartet, bis der Build-Job erfolgreich ist
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Jeder Job laeuft auf einer eigenen, frischen VM. Die node_modules aus dem
      # Build-Job sind hier nicht vorhanden, darum muss nochmals installiert werden.
      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test
